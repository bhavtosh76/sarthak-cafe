<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e23744" />
    <meta
      name="description"
      content="Sarthak Cafe — fresh food, snacks & beverages delivered hot. Order online from Sarthak Cafe."
    />
    <title>Sarthak Cafe — Order Fresh Food Online</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes light.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('sarthak-theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
